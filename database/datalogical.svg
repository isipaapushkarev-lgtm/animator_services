<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1000" viewBox="0 0 1500 1000">
<defs><style>.t{font:700 22px Arial;fill:#fff}.a{font:15px Consolas;fill:#1b102d}.h{fill:#8b5cf6}.b{fill:#fff;stroke:#312248;stroke-width:3}.l{fill:none;stroke:#ff3cac;stroke-width:4}.r{font:700 15px Arial;fill:#8b5cf6}</style><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ff3cac"/></marker></defs>
<rect width="1500" height="1000" fill="#f8f6fb"/><text x="45" y="45" font="700 30px Arial" fill="#1b102d">Даталогическая схема БД animator_services</text>
<path class="l" marker-end="url(#m)" d="M390 230H545"/><text class="r" x="430" y="217">1 : N</text><path class="l" marker-end="url(#m)" d="M1035 230H885"/><text class="r" x="925" y="217">1 : N</text><path class="l" marker-end="url(#m)" d="M1245 360V420H715V485"/><text class="r" x="1222" y="405">1 : N</text><path class="l" marker-end="url(#m)" d="M1035 600H885"/><text class="r" x="925" y="587">1 : N</text><path class="l" marker-end="url(#m)" d="M220 360V485"/><text class="r" x="235" y="430">1 : N</text><path class="l" marker-end="url(#m)" d="M545 290C470 325 470 535 390 555"/><text class="r" x="455" y="435">1 : 1</text><path class="l" marker-end="url(#m)" d="M35 220H18V880H35"/><text class="r" x="25" y="760">1 : N</text><path class="l" marker-end="url(#m)" d="M545 320C455 390 470 860 390 880"/><text class="r" x="445" y="790">1 : N</text><path class="l" marker-end="url(#m)" d="M885 290C970 320 970 535 1035 555"/><text class="r" x="955" y="435">N : 1</text>
<g transform="translate(35 80)"><rect class="b" width="355" height="280" rx="16"/><rect class="h" width="355" height="50" rx="16"/><text class="t" x="18" y="33">users</text><text class="a" x="18" y="80">PK id INT UNSIGNED AI</text><text class="a" x="18" y="108">name VARCHAR(100) NOT NULL</text><text class="a" x="18" y="136">phone VARCHAR(20) NOT NULL</text><text class="a" x="18" y="164">email VARCHAR(190) UNIQUE</text><text class="a" x="18" y="192">password_hash VARCHAR(255)</text><text class="a" x="18" y="220">role ENUM(client, admin)</text><text class="a" x="18" y="248">created_at TIMESTAMP</text></g>
<g transform="translate(545 80)"><rect class="b" width="340" height="280" rx="16"/><rect class="h" width="340" height="50" rx="16"/><text class="t" x="18" y="33">orders</text><text class="a" x="18" y="78">PK id INT UNSIGNED AI</text><text class="a" x="18" y="104">FK user_id INT UNSIGNED</text><text class="a" x="18" y="130">FK program_id INT UNSIGNED</text><text class="a" x="18" y="156">FK animator_id INT UNSIGNED</text><text class="a" x="18" y="182">event_date DATE, event_time TIME</text><text class="a" x="18" y="208">address VARCHAR(255)</text><text class="a" x="18" y="234">total_price DECIMAL(10,2)</text><text class="a" x="18" y="260">status ENUM(...)</text></g>
<g transform="translate(1035 80)"><rect class="b" width="420" height="280" rx="16"/><rect class="h" width="420" height="50" rx="16"/><text class="t" x="18" y="33">programs</text><text class="a" x="18" y="80">PK id INT UNSIGNED AI</text><text class="a" x="18" y="108">name VARCHAR(120) NOT NULL</text><text class="a" x="18" y="136">slug VARCHAR(140) UNIQUE</text><text class="a" x="18" y="164">description TEXT</text><text class="a" x="18" y="192">duration_minutes SMALLINT</text><text class="a" x="18" y="220">heroes_count TINYINT</text><text class="a" x="18" y="248">price DECIMAL(10,2)</text></g>
<g transform="translate(545 485)"><rect class="b" width="340" height="230" rx="16"/><rect class="h" width="340" height="50" rx="16"/><text class="t" x="18" y="33">program_animators</text><text class="a" x="18" y="100">PK, FK program_id INT</text><text class="a" x="18" y="140">PK, FK animator_id INT</text><text class="a" x="18" y="190">M : N relation</text></g>
<g transform="translate(1035 485)"><rect class="b" width="420" height="300" rx="16"/><rect class="h" width="420" height="50" rx="16"/><text class="t" x="18" y="33">animators</text><text class="a" x="18" y="80">PK id INT UNSIGNED AI</text><text class="a" x="18" y="108">name VARCHAR(100)</text><text class="a" x="18" y="136">character_name VARCHAR(80)</text><text class="a" x="18" y="164">bio TEXT</text><text class="a" x="18" y="192">experience_years TINYINT</text><text class="a" x="18" y="220">rating DECIMAL(2,1)</text><text class="a" x="18" y="248">photo_path VARCHAR(255)</text></g>
<g transform="translate(35 485)"><rect class="b" width="355" height="250" rx="16"/><rect class="h" width="355" height="50" rx="16"/><text class="t" x="18" y="33">reviews</text><text class="a" x="18" y="82">PK id INT UNSIGNED AI</text><text class="a" x="18" y="112">FK user_id INT UNSIGNED</text><text class="a" x="18" y="142">FK order_id INT UNIQUE</text><text class="a" x="18" y="172">rating TINYINT</text><text class="a" x="18" y="202">title VARCHAR(120), body TEXT</text></g>
<g transform="translate(35 790)"><rect class="b" width="355" height="180" rx="16"/><rect class="h" width="355" height="50" rx="16"/><text class="t" x="18" y="33">photos</text><text class="a" x="18" y="82">PK id INT UNSIGNED AI</text><text class="a" x="18" y="112">FK user_id, order_id INT</text><text class="a" x="18" y="142">file_name VARCHAR(255)</text></g>
</svg>
